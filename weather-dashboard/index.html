<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🌤️ Weather Dashboard</h1>
      <p>Get accurate weather forecasts for any location</p>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search city name..."
          autocomplete="off"
        />
        <button id="searchBtn" class="search-btn">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </div>

    <!-- Current Weather Section -->
    <div id="currentWeather" class="current-weather hidden">
      <div class="weather-card">
        <div class="weather-header">
          <h2 id="cityName"></h2>
          <p id="date"></p>
        </div>
        <div class="weather-main">
          <div class="temp-section">
            <span id="temperature" class="temperature"></span>
            <span class="unit">°C</span>
          </div>
          <div class="weather-details">
            <p id="description" class="description"></p>
            <p id="feelsLike"></p>
          </div>
        </div>
        <div class="weather-info">
          <div class="info-item">
            <i class="fas fa-tint"></i>
            <div>
              <span>Humidity</span>
              <p id="humidity"></p>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-wind"></i>
            <div>
              <span>Wind Speed</span>
              <p id="windSpeed"></p>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-compress"></i>
            <div>
              <span>Pressure</span>
              <p id="pressure"></p>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-eye"></i>
            <div>
              <span>Visibility</span>
              <p id="visibility"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Forecast Section -->
    <div id="forecastSection" class="forecast-section hidden">
      <h3>5-Day Forecast</h3>
      <div id="forecast" class="forecast-grid"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Loading weather data...</p>
    </div>

    <!-- Error Message -->
    <div id="error" class="error hidden"></div>

    <!-- No Results -->
    <div id="noResults" class="no-results hidden">
      <i class="fas fa-search"></i>
      <p>Search for a city to get started</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
